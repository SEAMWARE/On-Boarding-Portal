server:
  port: 8080
  staticPath: ./static
  trustProxy: 1
  jsonBodyLimit: 100kb
  storage:
    destFolder: files
    maxSizeMB: 5
  cors:
    origin: "*"
    methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allowedHeaders:
      - Content-Type
      - Authorization
      - X-Organization
    credentials: true
    optionsSuccessStatus: 204
    maxAge: 600
logging:
  level: info
database:
  type: postgres
  host: localhost
  port: 5432
  username: ""
  password: ""
  database: onboarding
  synchronize: true
  logging: false
  # Force UTC timezone for date storage. Ignored by PostgreSQL driver, required for MySQL to store dates in UTC.
  timezone: "Z"
app:
  login:
    openIdUrl: ""
    clientId: ""
    clientSecret: ""
    scope: openid
    codeChallenge: true
  keycloak:
    didCreationEnabled: false
    realmName: master
    grantType: password
    clientId: "admin-cli"
    realmNameLength: 36
    adminPasswordLength: 30
    adminEmailLifespan: 72h
    adminUserConfig:
      enabled: true
      username: admin
      emailVerified: false
      groups:
        - /admin
      clientRoles:
        realm-management:
          - manage-users
          - query-groups
          - query-users
          - view-users
          # Client scopes share the "clients" resource type in Keycloak's admin
          # permission model, so this is what unlocks the Client scopes section
          # in the Admin Console, not a separate scope-specific role.
          - view-clients
        account:
          - manage-account
          - view-groups
          - view-profile
      realmRoles: []
      requiredActions:
        - VERIFY_EMAIL
        - UPDATE_PASSWORD
    # Client scopes created through the Admin API *after* the realm exists, and then
    # attached to every client in it. Kept for `openid-connect` scopes only: OID4VC
    # credential scopes are declared inside `defaultRealmConfig.clientScopes` below,
    # because the realm import does not enforce a protocol match between a client and
    # its scopes while `clients.addOptionalClientScope` may.
    additionalClientScopes: []
    defaultRealmConfig:
      verifiableCredentialsEnabled: true
      enabled: true
      attributes:
        preAuthorizedCodeLifespanS: 120
        issuerDid: ${DID}
        # Keycloak only auto-creates the built-in default client scopes (roles, profile,
        # email, web-origins, acr, basic, ...) when the import's `clientScopes` is absent
        # (RealmManager#isCreateDefaultClientScopes). Since clientScopes below declares
        # LegalPersonCredential, that auto-creation is skipped unless forced here — without
        # it, the built-in scope names referenced by `clients[].defaultClientScopes` and
        # `defaultDefaultClientScopes`/`defaultOptionalClientScopes` don't exist.
        CreateDefaultClientScopes: "true"
      clients:
        - clientId: ${DID}
          enabled: true
          protocol: openid-connect
          publicClient: false
          serviceAccountsEnabled: true
          clientAuthenticatorType: client-secret
          redirectUris: []
          directAccessGrantsEnabled: true
          # Keycloak 26.4+ keeps VC clients on openid-connect and opts them into issuance
          # with this attribute; without it /create-credential-offer is rejected.
          attributes:
            oid4vci.enabled: "true"
          defaultClientScopes:
            - web-origins
            - acr
            - roles
            - profile
            - basic
            - email
          # Optional, NOT default: a credential scope in defaultClientScopes fails with
          # "Credential client scope not found".
          optionalClientScopes:
            - LegalPersonCredential
          surrogateAuthRequired: false
          alwaysDisplayInConsole: false
          defaultRoles: []
          webOrigins: []
          notBefore: 0
          bearerOnly: false
          consentRequired: false
          standardFlowEnabled: true
          implicitFlowEnabled: false
          frontchannelLogout: false
          protocolMappers: []
          authenticationFlowBindingOverrides: {}
          fullScopeAllowed: true
          nodeReRegistrationTimeout: -1
        - attributes:
            oid4vci.enabled: "true"
            pkce.code.challenge.method: S256
            post.logout.redirect.uris: +
          clientId: 9c481dc3-2ad0-4fe0-881d-c32ad02fe0fc
          defaultClientScopes:
            - web-origins
            - acr
            - roles
            - profile
            - basic
            - email
          description: Hardcoded clientId expected by the Lissi ID Wallet (iOS/Android).
          directAccessGrantsEnabled: false
          enabled: true
          fullScopeAllowed: true
          implicitFlowEnabled: false
          name: Lissi ID Wallet
          optionalClientScopes:
            - OperatorCredential
            - LegalPersonCredential
          protocol: openid-connect
          publicClient: true
          redirectUris:
            - https://oob.lissi.io/vci-cb
            - https://wallet.lissi.io/lite/vci-cb
          serviceAccountsEnabled: false
          standardFlowEnabled: true
          webOrigins:
            - +
        - attributes:
            dpop.bound.access.tokens: "true"
            oid4vci.enabled: "true"
            pkce.code.challenge.method: S256
            post.logout.redirect.uris: +
            require.pushed.authorization.requests: "true"
          clientId: wallet-dev
          defaultClientScopes:
            - web-origins
            - acr
            - roles
            - profile
            - basic
            - email
          description: Public client used by EUDI Reference Wallet (.DEV variant). PKCE +
            PAR + DPoP-bound access tokens.
          directAccessGrantsEnabled: false
          enabled: true
          fullScopeAllowed: true
          implicitFlowEnabled: false
          name: EUDI Reference Wallet (dev)
          optionalClientScopes:
            - OperatorCredential
            - LegalPersonCredential
          protocol: openid-connect
          publicClient: true
          redirectUris:
            - eu.europa.ec.euidi://authorization
          serviceAccountsEnabled: false
          standardFlowEnabled: true
          webOrigins:
            - +
      # OID4VCI model of Keycloak 26.4+ (keycloak#39768): one ClientScope with
      # `protocol: oid4vc` per issuable credential, described by its own `vc.*`
      # attributes. The pre-26.4 realm attributes `vc.<name>.*` and the
      # `components.CredentialBuilder` block are gone — Keycloak ignores them silently.
      # Declared here (inside the realm import) rather than in additionalClientScopes so
      # the scope already exists when the clients referencing it are created.
      clientScopes:
        - name: LegalPersonCredential
          description: OID4VC scope that issues the LegalPersonCredential.
          protocol: oid4vc
          attributes:
            include.in.token.scope: "true"
            display.on.consent.screen: "false"
            vc.issuer_did: ${DID}
            # dc+sd-jwt, not vc+sd-jwt: OID4VCI 1.0 renamed the SD-JWT VC identifier.
            vc.format: dc+sd-jwt
            # Drives the SD-JWT `vct` claim; supported_credential_types drives the
            # JWT-VC-JSON `type` array and the metadata credential_definition.type.
            vc.verifiable_credential_type: LegalPersonCredential
            vc.supported_credential_types: LegalPersonCredential
            vc.credential_signing_alg: ES256
            vc.credential_build_config.token_jws_type: dc+sd-jwt
            # Both on purpose: the admin console displays expiry_in_seconds, but the `exp`
            # of the issued credential comes from refresh_interval_in_seconds.
            vc.expiry_in_seconds: "31536000"
            vc.refresh_interval_in_seconds: "31536000"
            # Red list of KC 26.4+: iss,iat,nbf,exp,cnf,vct,status must NOT be undisclosed,
            # or issuance aborts with "UndisclosedClaims contains red listed claim names".
            vc.credential_build_config.sd_jwt.visible_claims: "iss,iat,nbf,exp,cnf,vct,status,roles,email"
            vc.credential_build_config.sd_jwt.number_of_decoys: "3"
            # Holder binding via proof-of-possession, replacing proof_types_supported.
            vc.binding_required: "true"
            vc.binding_required_proof_types: jwt
            vc.cryptographic_binding_methods_supported: jwk
          # supportedCredentialTypes is gone: a mapper belongs to exactly one client scope,
          # so mapper-to-credential membership is structural now. subjectProperty is now
          # claim.name. Names must be unique within the scope.
          protocolMappers:
            - name: context-mapper
              protocol: oid4vc
              protocolMapper: oid4vc-context-mapper
              consentRequired: false
              config:
                context: https://www.w3.org/2018/credentials/v1
            - name: firstName-mapper
              protocol: oid4vc
              protocolMapper: oid4vc-user-attribute-mapper
              consentRequired: false
              config:
                claim.name: firstName
                userAttribute: firstName
            - name: email-mapper
              protocol: oid4vc
              protocolMapper: oid4vc-user-attribute-mapper
              consentRequired: false
              config:
                claim.name: email
                userAttribute: email
            - name: lastName-mapper
              protocol: oid4vc
              protocolMapper: oid4vc-user-attribute-mapper
              consentRequired: false
              config:
                claim.name: lastName
                userAttribute: lastName
            - name: role-mapper
              protocol: oid4vc
              protocolMapper: oid4vc-target-role-mapper
              consentRequired: false
              config:
                claim.name: roles
                clientId: ${DID}
      defaultDefaultClientScopes:
        - acr
        - roles
        - role_list
        - email
        - web-origins
        - profile
      defaultOptionalClientScopes:
        - LegalPersonCredential
      groups:
        - name: admin
          clientRoles:
            realm-management:
              - manage-users
              - manage-realm
              - query-users
              - query-groups
              - view-users
              - view-clients
    keys:
      curveType: P-256
  tir: {}
email:
  enabled: false
  type: "nodemailer"
  from: "onboarding@seamware.com"
  update:
    subject: "OnBoarding Portal - Registration updated"
    html: "file://./templates/update.html"
  submit:
    subject: "OnBoarding Portal - Registration submited"
    html: "file://./templates/submit.html"
  active:
    subject: "OnBoarding Portal - Registration activated"
    html: "file://./templates/active.html"
